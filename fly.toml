# fly.toml app configuration file generated for el-bruto on 2026-06-02T17:19:37Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'el-bruto'
primary_region = 'cdg'

[build]

[[mounts]]
  source = 'elbruto_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
