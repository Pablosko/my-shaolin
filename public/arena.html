<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena - My Shaolin</title>
  <link rel="stylesheet" href="/css/style.css?v=11">
</head>
<body>
  <div id="app-header"></div>

  <div class="container">
    <div id="seleccion-oponentes">
      <div class="card">
        <h2>⚔️ Arena</h2>
        <p style="color:#8b6fa0;margin-bottom:8px">
          Combates normales dan XP, cuentan para el límite diario.
          Entrenamiento no da XP pero puedes pelear con quien quieras.
        </p>

        <div class="arena-tabs">
          <button class="arena-tab active" data-tab="normal">⚔️ Combate Normal</button>
          <button class="arena-tab" data-tab="entreno">🥋 Entrenamiento</button>
        </div>

        <div id="combates-restantes-box" style="color:#8b6fa0;margin-bottom:12px">
          Combates disponibles hoy: <span id="combates-restantes">500</span> / 500
        </div>
        <div id="entreno-info" class="hidden" style="color:#34d399;margin-bottom:12px">
          🥋 Modo entrenamiento — sin límite diario, sin XP
        </div>

        <div id="oponentes-lista" class="oponentes-lista"></div>
      </div>
    </div>

    <div id="pantalla-combate" class="hidden">
      <div class="combate-screen">
        <h2>⚔️ <span id="combate-mode-label">COMBATE</span></h2>

        <div class="campo-batalla">
          <!-- Fila superior: HUD completo -->
          <div class="hud-row">
            <div class="hp-corner left">
              <div class="fighter-label">
                <span class="fighter-icon" id="mi-icon">🗡️</span>
                <span class="fighter-name" id="mi-nombre">-</span>
              </div>
              <div class="hp-row">
                <div class="hp-bar-bg"><div class="hp-relleno hp-verde" id="mi-hp-relleno"></div></div>
                <span class="hp-texto" id="mi-hp-texto">-/-</span>
              </div>
              <div class="weapon-strip" id="mi-weapons-strip"></div>
            </div>
            <div class="dist-center">
              <div class="dist-nombre" id="rango-indicator">Distancia 3 · Corta</div>
              <div class="dist-pips" id="distance-pips"># # # # # # # # #</div>
            </div>
            <div class="hp-corner right">
              <div class="fighter-label">
                <span class="fighter-name" id="op-nombre">-</span>
                <span class="fighter-icon" id="op-icon">🤖</span>
              </div>
              <div class="hp-row">
                <div class="hp-bar-bg"><div class="hp-relleno hp-rojo" id="op-hp-relleno"></div></div>
                <span class="hp-texto" id="op-hp-texto">-/-</span>
              </div>
              <div class="weapon-strip" id="op-weapons-strip"></div>
            </div>
          </div>

          <!-- Fondo de arena: sprites distribuidos izquierda ↔ derecha -->
          <div class="arena-floor">
            <div class="fighter-sprite" id="luchador-mi" style="--pos:2">
              <img id="mi-sprite" src="" alt="P1" />
              <div class="weapon-hand hidden" id="mi-equipada"></div>
              <div class="pa-badge">PA: <span id="pa-mi-valor">0</span></div>
            </div>
            <div class="fighter-sprite" id="luchador-op" style="--pos:2">
              <img id="op-sprite" src="" alt="P2" />
              <div class="weapon-hand hidden" id="op-equipada"></div>
              <div class="pa-badge">PA: <span id="pa-op-valor">0</span></div>
            </div>
          </div>
        </div>

        <div id="log-combate" class="log-combate"></div>
        <div id="resultado" class="hidden"></div>
        <div id="acciones-post-combate" class="hidden post-combat-actions"></div>
      </div>
    </div>
  </div>

  <script src="/js/api.js?v=11"></script>
  <script src="/js/auth.js?v=6"></script>
  <script src="/js/header.js?v=6"></script>
  <script src="/js/combate.js?v=11"></script>
</body>
</html>
