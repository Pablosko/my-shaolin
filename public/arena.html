<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena - My Shaolin</title>
  <link rel="stylesheet" href="/css/style.css?v=6">
</head>
<body>
  <div id="app-header"></div>

  <div class="container">
    <div id="seleccion-oponentes">
      <div class="card">
        <h2>⚔️ Arena</h2>
        <p style="color:#8b6fa0;margin-bottom:8px">
          Combates normales dan XP, cuentan para el límite diario.
          Entrenamiento no da XP pero puedes pelear con quien quieras.
        </p>

        <div class="arena-tabs">
          <button class="arena-tab active" data-tab="normal">⚔️ Combate Normal</button>
          <button class="arena-tab" data-tab="entreno">🥋 Entrenamiento</button>
        </div>

        <div id="combates-restantes-box" style="color:#8b6fa0;margin-bottom:12px">
          Combates disponibles hoy: <span id="combates-restantes">500</span> / 500
        </div>
        <div id="entreno-info" class="hidden" style="color:#34d399;margin-bottom:12px">
          🥋 Modo entrenamiento — sin límite diario, sin XP
        </div>

        <div id="oponentes-lista" class="oponentes-lista"></div>
      </div>
    </div>

    <div id="pantalla-combate" class="hidden">
      <div class="card combate-screen">
        <h2>⚔️ <span id="combate-mode-label">COMBATE</span></h2>

        <div class="combat-info-row">
          <div class="fighter-pa" id="pa-mi"><span class="pa-label">PA:</span> <span class="pa-valor" id="pa-mi-valor">0</span></div>
          <div class="rango-indicator" id="rango-indicator">Rango 3 · Guardia</div>
          <div class="fighter-pa" id="pa-op"><span class="pa-label">PA:</span> <span class="pa-valor" id="pa-op-valor">0</span></div>
        </div>

        <div class="campo-batalla" id="campo-batalla">
          <div class="arena-strip" id="arena-strip">
            <div class="rango-marcador" id="rango-0">0</div>
            <div class="rango-marcador" id="rango-1">1</div>
            <div class="rango-marcador" id="rango-2">2</div>
            <div class="rango-marcador" id="rango-3">3</div>
            <div class="rango-marcador" id="rango-4">4</div>
          </div>

          <div class="luchador-scene" id="luchador-scene">
            <div class="luchador-arena" id="luchador-mi" style="--pos:0">
              <div class="luchador-header">
                <div class="luchador-avatar" id="mi-avatar">👨</div>
                <div class="weapon-reserve" id="mi-weapons"></div>
              </div>
              <div class="luchador-nombre" id="mi-nombre">-</div>
              <div class="weapon-equipada hidden" id="mi-equipada"></div>
              <div class="hp-contenedor">
                <div class="hp-barra-ext"><div class="hp-relleno hp-verde" id="mi-hp-relleno"></div></div>
                <span class="hp-texto" id="mi-hp-texto">-</span>
              </div>
            </div>

            <div class="luchador-arena" id="luchador-op" style="--pos:0">
              <div class="luchador-header">
                <div class="luchador-avatar" id="op-avatar">🤖</div>
                <div class="weapon-reserve" id="op-weapons"></div>
              </div>
              <div class="luchador-nombre" id="op-nombre">-</div>
              <div class="weapon-equipada hidden" id="op-equipada"></div>
              <div class="hp-contenedor">
                <div class="hp-barra-ext"><div class="hp-relleno hp-rojo" id="op-hp-relleno"></div></div>
                <span class="hp-texto" id="op-hp-texto">-</span>
              </div>
            </div>
          </div>
        </div>

        <div id="log-combate" class="log-combate"></div>
        <div id="resultado" class="hidden"></div>
        <div id="acciones-post-combate" class="hidden post-combat-actions"></div>
      </div>
    </div>
  </div>

  <script src="/js/api.js?v=6"></script>
  <script src="/js/auth.js?v=6"></script>
  <script src="/js/header.js?v=6"></script>
  <script src="/js/combate.js?v=6"></script>
</body>
</html>
