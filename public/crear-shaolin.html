<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Guerrero - My Shaolin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="header">
    <h1>🥋 My Shaolin</h1>
    <div class="user-info">
      <span id="user-name"></span>
      <button id="logout-btn" class="btn btn-secundario">Salir</button>
    </div>
  </div>

  <div class="container">
    <div class="card" style="max-width:600px;margin:0 auto">
      <h2 style="text-align:center">Crear nuevo Guerrero</h2>

      <!-- Paso 1: Nombre y género -->
      <div id="paso-1" class="creacion-paso active">
        <div class="form-group">
          <label>Nombre del Guerrero</label>
          <input type="text" id="shaolin-name" placeholder="Ej: Shaolin Master" maxlength="20">
        </div>

        <label style="display:block;margin-bottom:12px;color:#a78bfa">Género</label>
        <div class="genero-selector">
          <div class="genero-opcion" data-genero="masculino" onclick="seleccionarGenero('masculino')">
            👨<span>Masculino</span>
          </div>
          <div class="genero-opcion" data-genero="femenino" onclick="seleccionarGenero('femenino')">
            👩<span>Femenino</span>
          </div>
        </div>

        <button class="btn btn-primario mt-20" style="width:100%" onclick="siguientePaso()">Siguiente</button>
      </div>

      <!-- Paso 2: Stats generados -->
      <div id="paso-2" class="creacion-paso">
        <h3 style="text-align:center;color:#a78bfa">Stats generados</h3>
        <div id="stats-preview" class="stats-creacion hidden">
          <div class="stat-item"><span class="stat-label">❤️ HP</span><span class="stat-value" id="stat-hp">65</span></div>
          <div class="stat-item"><span class="stat-label">💪 Fuerza</span><span class="stat-value" id="stat-fuerza">5</span></div>
          <div class="stat-item"><span class="stat-label">🏃 Agilidad</span><span class="stat-value" id="stat-agilidad">5</span></div>
          <div class="stat-item"><span class="stat-label">⚡ Velocidad</span><span class="stat-value" id="stat-velocidad">5</span></div>
        </div>
        <p style="text-align:center;color:#8b6fa0;margin-top:8px">Estos stats se asignarán aleatoriamente</p>
        <button class="btn btn-primario mt-20" style="width:100%" onclick="siguientePaso()">Siguiente - Elegir regalo</button>
      </div>

      <!-- Paso 3: Elección -->
      <div id="paso-3" class="creacion-paso">
        <h3 style="text-align:center;color:#a78bfa">Elige tu regalo inicial</h3>
        <p style="text-align:center;color:#8b6fa0;margin-bottom:16px">Cada opción te da un objeto diferente. ¡Elige sabiamente!</p>

        <div id="opciones-container" class="eleccion-items">
          <div style="text-align:center;color:#8b6fa0;grid-column:1/-1;padding:20px">Generando opciones...</div>
        </div>

        <button id="crear-btn" class="btn btn-primario mt-20" style="width:100%" onclick="crearShaolin()" disabled>Crear Guerrero</button>
      </div>

      <!-- Paso 4: Resultado -->
      <div id="paso-4" class="creacion-paso">
        <div id="resultado-creacion"></div>
      </div>
    </div>
  </div>

  <script src="/js/api.js?v=4"></script>
  <script src="/js/auth.js?v=4"></script>
  <script src="/js/crear-shaolin.js?v=4"></script>
</body>
</html>
