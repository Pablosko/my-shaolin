<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Shaolin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <h1>🥋 MY SHAOLIN</h1>
      <p class="subtitle">Crea tu guerrero y domina el templo</p>

      <div class="tabs">
        <div class="tab active" data-tab="login">Iniciar sesión</div>
        <div class="tab" data-tab="register">Registrarse</div>
      </div>

      <div id="login-error" class="error-msg"></div>
      <div id="register-error" class="error-msg"></div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label>Usuario</label>
          <input type="text" name="username" placeholder="Tu nombre de usuario" required>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" name="password" placeholder="Tu contraseña" required>
        </div>
        <button type="submit" class="btn btn-primario" style="width:100%">Entrar</button>
      </form>

      <form id="register-form" class="auth-form hidden">
        <div class="form-group">
          <label>Usuario</label>
          <input type="text" name="username" placeholder="Elige un nombre de usuario" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="tu@email.com" required>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" name="password" placeholder="Mínimo 4 caracteres" required minlength="4">
        </div>
        <button type="submit" class="btn btn-primario" style="width:100%">Registrarse</button>
      </form>
    </div>
  </div>

  <script src="/js/api.js?v=4"></script>
  <script src="/js/auth.js?v=3"></script>
</body>
</html>
